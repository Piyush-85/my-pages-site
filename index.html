<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>My Pages Site</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #101827; color: #f3f6fb; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 2rem; }
    main { width: min(100%, 46rem); padding: clamp(2rem, 8vw, 5rem); border: 1px solid #34445c; border-radius: 1.5rem; background: linear-gradient(145deg, #1d2b42, #131d2d); box-shadow: 0 2rem 5rem #080d16aa; }
    p { color: #a9bad1; line-height: 1.7; }
    .eyebrow { color: #82e0c3; font-size: .8rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: .8rem 0; font-size: clamp(2.5rem, 8vw, 4.5rem); line-height: 1.05; letter-spacing: -.05em; }
    a { color: #82e0c3; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">GitHub Pages is ready</p>
    <h1>Welcome to your site.</h1>
    <p>This starter page is live from your repository. Edit <code>index.html</code> to make it yours.</p>
    <p><a href="https://docs.github.com/pages">Learn about GitHub Pages</a></p>
  </main>
</body>
</html>
